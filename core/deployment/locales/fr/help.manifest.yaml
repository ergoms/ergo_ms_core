# fr overlay for help.manifest.yaml (merged over Russian source)
sections:
- id: usage
  title: Utilisation
  about: appel des commandes et sections d'aide
  static_lines:
  - ergoms <commande> [arguments]
  - ergoms help                  — sections de l'aide
  - ergoms help <section>        — commandes de la section
  - ergoms help all              — liste complète des commandes
  - ergoms help modules          — liste des modules avec commandes ergoms
  - ergoms help module <nom>     — aide du module
  - ergoms <nom_module>:<commande> [arguments] — appeler une commande de module
  - 'Scénarios composés (setup, deploy, services, nginx/redis, docker, dev) — lifecycle/runner.py (recettes) ; liste : py
    -3.12 core/deployment/lifecycle/runner.py --list'
- id: builtin_services
  title: Services OS (intégrés)
  about: installation et démarrage groupé des services
  note: Nécessitent les droits administrateur (Windows) ou root/sudo (Linux). Pour le développement, start-all suffit.
  commands:
  - name: install
    summary: 'Alias de install-services : installer et démarrer tous les services'
  - name: install-services
    summary: Installer et démarrer les services OS selon HOST_PROFILE (modules via host_lifecycle.yaml ; nginx/redis — si ERGO_PROXY/ERGO_BROKER)
  - name: install-api-service
    summary: Installer et démarrer uniquement le service API
  - name: install-client-service
    summary: Installer et démarrer uniquement le service client
  - name: install-worker-service
    summary: Installer et démarrer les workers selon celery_workers.yaml
  - name: install-beat-service
    summary: Installer et démarrer Celery beat
  - name: install-media-service
    summary: Installer et démarrer Media API
  - name: install-module-service
    invoke: ergoms install-module-service --module=<name> --kind=api|worker|beat
    summary: Installer le service OS API, worker ou Beat du module
  - name: uninstall-module-service
    invoke: ergoms uninstall-module-service --module=<name> --kind=api|worker|beat
    summary: Supprimer le service OS API, worker ou Beat du module
  - name: start
    summary: Démarrer tous les services
  - name: stop
    summary: Arrêter tous les services
  - name: restart
    summary: Redémarrer tous les services
  - name: status
    summary: État de tous les services
  - name: uninstall-services
    invoke: ergoms uninstall-services [-Purge|--purge]
    summary: Supprimer les services OS (modules via host_lifecycle.yaml ; avec --purge — supprimer les données)
  - name: logs
    invoke: ergoms logs <nom_du_service|setup-full|ergoms> [lignes]
    summary: Journal du service ou de la session CLI (setup-full.log / ergoms.log)
  - name: setup-full
    summary: Configuration initiale complète ; Redis/nginx — si ERGO_BROKER=redis / ERGO_PROXY=nginx
  - name: install-cli
    summary: Vérifier ergoms local et sous Linux créer /usr/local/bin/ergoms
  - name: uninstall-cli
    summary: Retirer le lien /usr/local/bin/ergoms ; les fichiers dans bin restent
- id: development
  title: Développement local
  about: API, client et tâches de fond en local
  commands:
  - name: dev
    summary: Démarrer l'API avec préchauffage des caches (mode depuis ERGO_ENV)
  - name: start-all
    summary: Journaux DB, Redis, Meilisearch et Jupyter (si activés), API, client, Media API, worker et beat (sans services OS)
  - name: start-api
    summary: API uniquement
  - name: start-module
    invoke: ergoms start-module --module=<name>
    summary: API HTTP d'un seul module (MODULE_RUNTIME=microservice ; HOST_PROFILE et MODULE_PROCESS_PROFILE dans env)
  - name: start-client
    summary: Client (Vite, ou nginx si NGINX_ENABLED=true)
  - name: start-media
    summary: Media API
  - name: start-worker
    invoke: ergoms start-worker [--worker=<nom>] [--module=<name> [--worker=<id>]]
    summary: Worker Celery. Avec --module, le worker partagé du module et chaque worker nommé de celery_workers.yaml; avec les deux options, un seul worker du module
  - name: start-beat
    invoke: ergoms start-beat [--module=<name>]
    summary: Celery beat (noyau, ou un module avec --module)
  - name: start-jupyter
    summary: JupyterLab avec le noyau Django (modes local/lan/nginx — API_JUPYTER_* dans .env)
  - name: start-jupyter-dev
    summary: JupyterLab en mode développement si ERGO_JUPYTER n'est pas none
  - name: stop-jupyter-dev
    summary: Stub d'arrêt de JupyterLab (le processus se termine avec le terminal)
  - name: stop-worker
    invoke: ergoms stop-worker [--module=<name> [--worker=<id>]]
    summary: Arrêter les workers Celery. Sans arguments — tous sur l'hôte; --module — ceux du module; --worker — un seul
  - name: stop-beat
    summary: Arrêter Celery beat
  - name: sync-logs-services
    summary: Afficher les listes multi-terminal (--json TARGET pour JSON)
  - name: rotate-logs
    invoke: ergoms rotate-logs [--dry-run] [-v]
    summary: Rotation des journaux infra par taille et compression gzip (ERGO_LOG_INFRA_* dans .env)
  - name: logs-status
    invoke: ergoms logs-status [--json]
    summary: Afficher l'espace disque utilisé par le répertoire logs/
  - name: install-infra-log-rotate
    summary: Planificateur de rotation des journaux infra (toutes les heures par défaut, cron / Task Scheduler)
  - name: resource-usage
    invoke: ergoms resource-usage [--json] [-w] [--interval N]
    summary: Consommation RAM/CPU des processus ERGO MS sur l'hôte
  - name: celery-balance
    invoke: ergoms celery-balance [--dry-run] [--watch] [--json] [--cluster]
    summary: Budget et concurrence Celery (observe / recommend / auto)
  - name: celery-requeue
    invoke: ergoms celery-requeue
    summary: Remettre dans la file les tâches Celery dont le worker ne les détient plus
  - name: loadtest
    invoke: ergoms loadtest [--profile …] [--isolated-db|--docker-isolated] | --find-limit … | --cleanup-users
    summary: Test de charge API/pages (Locust), find-limit, isolation BDD ou suppression lt_*
- id: docker
  title: Docker Compose
  about: conteneurs et workers du cluster
  note: Variables DOCKER_* et profiles — section Docker dans .env.example. Ports — API_PORT, CLIENT_PORT, etc. BD — databases.yaml.
  commands:
  - name: docker-init
    summary: 'Premier lancement : build, services worker, up, install, migrate'
  - name: docker-clean
    summary: 'Nettoyage complet : conteneurs, volumes, images locales, artefacts compose (confirmation dans le terminal)'
  - name: docker-up
    summary: Démarrer la stack (DOCKER_MODE, profiles depuis .env)
  - name: docker-down
    summary: Arrêter et supprimer les conteneurs
  - name: docker-loadtest-up
    summary: Démarrer la stack loadtest isolée (postgres-loadtest + api-loadtest) et migrer
  - name: docker-loadtest-down
    summary: Arrêter les services loadtest (api-loadtest, postgres-loadtest)
  - name: docker-restart
    summary: down + up
  - name: docker-dev
    summary: docker-up en mode dev (Vite, bind-mount)
  - name: docker-prod
    summary: docker-up en mode prod (daphne, client-build)
  - name: docker-build
    summary: Construire les images api/client
  - name: docker-ps
    summary: État des conteneurs
  - name: docker-stats
    invoke: ergoms docker-stats [--json] [-w]
    summary: Consommation RAM/CPU des conteneurs Docker Compose
  - name: docker-logs
    invoke: ergoms docker-logs [-f] [service]
    summary: Journaux des conteneurs
  - name: docker-migrate
    summary: Migrations dans le conteneur api
  - name: docker-install-deps
    summary: Dépendances Python (poetry) dans le conteneur api
  - name: docker-install-npm
    summary: Dépendances npm dans le conteneur client/api
  - name: docker-shell-api
    summary: Shell interactif dans le conteneur api
  - name: docker-gen-workers
    summary: Régénérer compose depuis celery_workers.yaml
  - name: docker-gen-modules
    summary: Régénérer compose depuis MICROSERVICE_MODULES (MODULE_RUNTIME=microservice)
  - name: docker-registry
    summary: Registre d'images local sur DOCKER_SWARM_REGISTRY, uniquement pour les nœuds du cluster
  - name: docker-swarm-push
    summary: Construire la cible worker de l'image Python et l'envoyer au registre du cluster
  - name: docker-swarm-deploy
    summary: Démarrer l'agent de budget et le worker Celery sur les nœuds Swarm
  - name: docker-swarm-down
    summary: Retirer la pile des workers Swarm
- id: dependencies
  title: Dépendances et base de données
  about: dépendances, migrations et configuration initiale
  commands:
  - name: setup
    summary: Configuration initiale complète (git, venv, poetry, npm, migrate, static)
  - name: install-deps
    summary: Python + npm, migrations et préchauffage des caches
  - name: python-install
    summary: Installer les dépendances Python ; --recreate-venv recrée le venv depuis le Python portable
  - name: python-update
    summary: Mettre à jour les dépendances Python du noyau et des modules (poetry update)
  - name: db-migrate
    summary: Appliquer les migrations
  - name: db-backup
    invoke: ergoms db-backup [--database=alias]
    summary: Instantané des bases SQL de databases.yaml dans virtual_env/backups/
  - name: db-restore
    invoke: ergoms db-restore --latest [--yes] | ergoms db-restore --from=virtual_env/backups/<stamp> [--yes]
    summary: Restaurer les bases SQL depuis un instantané dans virtual_env/backups/
  - name: install-postgres-backup-schedule
    invoke: ergoms install-postgres-backup-schedule [--uninstall]
    summary: Installer ou retirer l'instantané selon POSTGRES_BACKUP_SCHEDULE
  - name: db-migrate-module
    invoke: ergoms db-migrate-module --module=<name> [--database=alias] [--grant-role=role] [--all]
    summary: Créer le schéma m_<name> et migrer les applications du module
  - name: db-move-module-schema
    invoke: ergoms db-move-module-schema --module=<name> [--dry-run] [--all]
    summary: Déplacer les tables du module de public ou core vers m_<name> ; --all puis le cœur et suppression de public
  - name: db-move-core-schema
    invoke: ergoms db-move-core-schema [--dry-run] [--keep-public]
    summary: Déplacer le reste de public vers core et supprimer le schéma public
  - name: data-inventory
    invoke: ergoms data-inventory [--json]
    summary: Carte des FK/SQL des modules et des bloqueurs d'extraction
  - name: db-makemigrations
    summary: Créer les fichiers de migration
  - name: migrate-all
    summary: Créer et appliquer les migrations
  - name: update-all
    summary: Mettre à jour les dépendances Python et npm (noyau et modules)
  - name: reinstall
    summary: Réinstaller les dépendances (poetry install --sync et npm run install:all)
  - name: deps
    summary: Rapport des dépendances du projet
- id: build
  title: Compilation
  about: compilation du client et statiques du serveur
  commands:
  - name: client-build
    summary: Compiler le client selon le rôle de l'hôte ; avec nginx, régénère la config et reload
  - name: client-build-analyze
    summary: Compiler le client avec le rapport rollup-plugin-visualizer (dist/stats.html)
  - name: client-build-remote
    summary: Compiler le federated remote d'un module (--module=name → virtual_env/client-remotes/)
  - name: client-build-standalone
    summary: Compiler le SPA autonome d'un module (--module=name → virtual_env/client-standalone/)
  - name: client-shell-pack
    summary: Empaqueter @ergo-ms/client-shell (virtual_env/client-shell/)
  - name: client-check
    summary: Vérification complète du client (lint, i18n, build, a11y) ; journaux sous logs/client-check/
  - name: client-preview
    summary: Prévisualiser la compilation du client
  - name: build-all
    summary: Compilation du client et collectstatic
  - name: collectstatic
    summary: Collecter les fichiers statiques Django
- id: cache_env
  title: Caches et configuration
  about: caches, environnement et processus locaux
  commands:
  - name: warmup-caches
    summary: Préchauffer les caches du noyau (apps, celery, modules_env)
  - name: warmup-caches-if-needed
    summary: Redis (si activé) et préchauffage uniquement si le cache est vide ou obsolète
  - name: ensure-redis-dev
    summary: Démarrer Redis pour le développement sans terminal de journaux
  - name: start-redis-dev
    summary: Redis en avant-plan pour VS Code (fermer le terminal arrête Redis)
  - name: stop-redis-dev
    summary: Arrêter les sessions Redis portable de dev (après fermeture du terminal)
  - name: start-db-dev
    summary: Journaux de la base default selon ERGO_DB pour VS Code Start All Services
  - name: start-nginx-dev
    summary: Nginx en avant-plan après disponibilité de l'API (fermer le terminal arrête nginx)
  - name: stop-nginx-dev
    summary: Arrêter les sessions nginx portable de dev (après fermeture du terminal)
  - name: start-client-dev
    summary: Client Vite après disponibilité de l'API (si nginx est désactivé)
  - name: stop-client-dev
    summary: Stub d'arrêt du client Vite (le processus se termine avec le terminal)
  - name: wait-api-ready
    summary: Attendre GET /api/system/ready/ avant de démarrer le client ou nginx
  - name: warmup-celery
    summary: Préchauffer uniquement les caches celery
  - name: invalidate-caches
    summary: Invalider tous les caches du noyau
  - name: invalidate-caches-warmup
    summary: Invalider les caches et les préchauffer à nouveau
  - name: generate-secret
    summary: Générer un secret pour .env (API_SECRET_KEY / API_JWT_SIGNING_KEY)
  - name: env
    invoke: ergoms env [--show-example-values] [--strict] [--reset-from-example] [--yes] [--root PATH]
    summary: Comparer .env avec .env.example ; --reset-from-example applique les modèles et conserve les secrets déjà définis
  - name: geoip-download
    summary: Télécharger la base GeoIP (DB-IP City Lite)

  - name: geoip-backfill
    summary: Remplir city/country dans les sessions via GeoIP
  - name: i18n-makemessages
    summary: Extraire les chaînes gettext de l'API en .po (ru/en/fr)
  - name: i18n-compilemessages
    summary: Compiler les catalogues .po de l'API en .mo
- id: maintenance
  title: Maintenance
  about: nettoyage, contrôles et mode maintenance
  commands:
  - name: clean
    summary: Supprimer les dépendances et static (media est conservé)
  - name: clear-pycache
    summary: Supprimer les répertoires __pycache__
  - name: maintenance-on
    summary: Activer le mode maintenance
  - name: maintenance-off
    summary: Désactiver le mode maintenance
  - name: maintenance-status
    summary: État du mode maintenance
  - name: restore-menu
    summary: Restaurer le menu depuis le noyau et les modules en ligne
  - name: sq-del-migrations
    summary: Fusion des migrations en 2 phases (create / finalize)
  - name: sync-squashed-migrations
    summary: Synchroniser les migrations squash dans django_migrations (fake)
  - name: safe-drop-app
    summary: Supprimer une application Django en toute sécurité
  - name: core-rules-check
    summary: 'Vérifications du noyau : isolation des modules, schémas de contrats du pont, manifests microservice, FK inter-schémas, console.error, select natif, imports
      modules.*, mid-indent/ast.parse, BOM/LF dans les scripts de déploiement'
  - name: deps-audit
    invoke: ergoms deps-audit
    summary: Vérifier les dépendances Python et npm (OSV, npm audit) ; High/Critical font échouer la commande
  - name: security-modes
    summary: "Référence des niveaux ERGO_SECURITY (étape 2 : clés absentes au runtime ; n'écrit pas .env)"
  - name: security-check
    summary: Rapport de conformité au niveau de sécurité (étape 2)
  - name: deployment-scenario-test
    invoke: ergoms deployment-scenario-test
    summary: Scénarios isolés hôte et Docker (ports et répertoires séparés ; n'écrit pas le .env du dépôt)
  - name: system-test
    invoke: ergoms system-test [--suite unit|install|commands|scenarios|security|performance|browser|os-services|all] [--launch docker|host|os-services] [--spec host_sqlite_direct] [--strict]
    summary: Tests système isolés depuis zéro (unit, installation, commandes, scénarios, sécurité, vitesse, navigateur, services OS)

  - name: ps1-encoding-check
    invoke: ergoms ps1-encoding-check [--fix]
    summary: Vérifier le BOM UTF-8 dans les .ps1 de déploiement avec cyrillique (Windows PowerShell 5.1)
  - name: sh-encoding-check
    invoke: ergoms sh-encoding-check [--fix]
    summary: Vérifier LF sans BOM dans les .sh de déploiement (shebang et source Linux)
  - name: upload-limits-check
    invoke: ergoms upload-limits-check
    summary: Rapport des limites de téléversement (MEDIA_UPLOAD_MAX_SIZE, direct-upload, nginx client_max_body_size)
  - name: test-smtp
    summary: Vérifier SMTP et envoyer un e-mail de test
  - name: lock-check
    invoke: ergoms lock-check
    summary: Vérifier que les paquets des modules ne sont pas entrés dans le poetry.lock et le package-lock.json du noyau
  - name: npm-lock-refresh
    summary: Reconstruire le package-lock.json du noyau après un changement de dépendances dans virtual_env/npm/package.json
  - name: npm-lock-sanitize
    summary: Retirer du package-lock.json du noyau les entrées de modules apparues par accident
  - name: ci
    invoke: ergoms ci
    summary: Contrôles rapides avant une demande de fusion (locks, règles du noyau, tests unitaires de déploiement, lint client, tests client des modules)
  - name: ci-nightly
    invoke: ergoms ci-nightly
    summary: Contrôles rapides et passage nocturne strict (SQLite, Docker, sécurité, navigateur). Un contrôle obligatoire ignoré est un échec
- id: service_aliases
  title: Services OS individuels
  about: démarrage et état d'un service
  note: Pour une gestion complète, ergoms start, stop, restart et status suffisent.
  commands:
  - name: start-api-service
    summary: Démarrer le service API
  - name: stop-api-service
    summary: Arrêter le service API
  - name: restart-api-service
    summary: Redémarrer le service API
  - name: status-api-service
    summary: État du service API
  - name: start-client-service
    summary: Démarrer le service client
  - name: stop-client-service
    summary: Arrêter le service client
  - name: restart-client-service
    summary: Redémarrer le service client
  - name: status-client-service
    summary: État du service client
  - name: start-worker-service
    summary: Démarrer le service worker
  - name: stop-worker-service
    summary: Arrêter le service worker
  - name: restart-worker-service
    summary: Redémarrer le service worker
  - name: status-worker-service
    summary: État du service worker
  - name: start-beat-service
    summary: Démarrer le service beat
  - name: stop-beat-service
    summary: Arrêter le service beat
  - name: restart-beat-service
    summary: Redémarrer le service beat
  - name: status-beat-service
    summary: État du service beat
  - name: start-media-service
    summary: Démarrer le service Media API
  - name: stop-media-service
    summary: Arrêter le service Media API
  - name: restart-media-service
    summary: Redémarrer le service Media API
  - name: status-media-service
    summary: État du service Media API
- id: deploy
  title: Déploiement
  about: déploiement API et client avec copie des bases
  commands:
  - name: deploy-api
    summary: Mettre à jour les sous-modules API, écrire les versions, copier les bases, appliquer les migrations et collecter static
  - name: deploy-client
    summary: Mettre à jour le sous-module client, dépendances, compilation
  - name: deploy-api-dev
    summary: Déployer l'API et démarrer en mode développement
  - name: deploy-client-dev
    summary: Déployer le client et démarrer le serveur de développement
  - name: deploy-all
    summary: Déploiement complet de l'API et du client. Avant les migrations — copie des bases ; versions dans logs/deploy-revision.txt
- id: nginx
  title: Nginx (optionnel)
  about: proxy inverse
  note: Automatique dans setup-full si NGINX_ENABLED=true. L'installation nécessite les droits administrateur ; status-nginx
    et test-nginx non.
  commands:
  - name: install-nginx
    summary: Installer et démarrer nginx
  - name: uninstall-nginx
    summary: Supprimer la configuration nginx
  - name: start-nginx
    summary: Démarrer nginx
  - name: stop-nginx
    summary: Arrêter nginx
  - name: restart-nginx
    summary: Redémarrer nginx
  - name: reload-nginx
    summary: Vérifier la configuration et recharger nginx
  - name: status-nginx
    summary: État de nginx
  - name: test-nginx
    summary: Vérifier la configuration nginx
- id: redis
  title: Redis (optionnel)
  about: courtier de files
  note: Portable sous virtual_env/packages/redis. Automatique dans setup-full si ERGO_BROKER=redis.
  commands:
  - name: install-redis
    summary: Installer et démarrer Redis
  - name: uninstall-redis
    summary: Arrêter Redis (--purge / -Purge supprime les paquets)
  - name: start-redis
    summary: Démarrer Redis
  - name: stop-redis
    summary: Arrêter Redis
  - name: restart-redis
    summary: Redémarrer Redis
  - name: status-redis
    summary: État de Redis
  - name: test-redis
    summary: Vérification via redis-cli ping
- id: meilisearch
  title: Meilisearch (recherche BM25)
  about: recherche plein texte
  note: Portable sous virtual_env/packages/meilisearch. Automatique dans setup-full si ERGO_SEARCH_ENABLED=true ; service OS via install-services. Voir env/search.env.example.
  commands:
  - name: install-meilisearch
    summary: Installer Meilisearch portable
  - name: install-meilisearch-service
    summary: Installer Meilisearch comme service OS (NSSM / systemd)
  - name: uninstall-meilisearch
    summary: Arrêter Meilisearch (--purge supprime les paquets et les données)
  - name: start-meilisearch
    summary: Démarrer Meilisearch (service ou processus)
  - name: stop-meilisearch
    summary: Arrêter Meilisearch
  - name: restart-meilisearch
    summary: Redémarrer Meilisearch
  - name: status-meilisearch
    summary: État de Meilisearch
  - name: test-meilisearch
    summary: Vérification /health de Meilisearch
  - name: start-meilisearch-dev
    summary: Démarrer Meilisearch en mode développement (terminal + journaux)
  - name: stop-meilisearch-dev
    summary: Arrêter le Meilisearch portable après fermeture du terminal de développement
  - name: search-reindex
    invoke: ergoms search-reindex [--index=core_users]
    summary: Réindexation Meilisearch (tous les index ou un seul)
  - name: publish-knowledge-packs
    invoke: ergoms publish-knowledge-packs
    summary: Publier les paquets d'aide de ce processus dans media_api (knowledge/)
- id: packages
  title: Paquets portables
  about: programmes du registre d'installation
  note: 'Registre sous virtual_env/packages : noyau (core_packages.yaml) et modules (packages.yaml). Services redis/nginx
    — commandes install-* séparées.'
  commands:
  - name: package-list
    summary: Lister les paquets du registre et l'état d'installation
  - name: runtime-check
    summary: Vérifier les versions et les liens de runtime_requirements.yaml
  - name: runtime-install-tools
    invoke: ergoms runtime-install-tools [--include-optional]
    summary: Installer les outils obligatoires via le registre commun des paquets
  - name: package-status
    invoke: ergoms package-status [name]
    summary: État détaillé d'un paquet ou de tous
  - name: package-install
    invoke: ergoms package-install <name> [--force] [--refresh]
    summary: Installer un paquet depuis le registre
  - name: package-uninstall
    invoke: ergoms package-uninstall <name> [--purge-extra]
    summary: Supprimer le répertoire du paquet (--purge-extra supprime aussi extra_dirs)
- id: huggingface
  title: Instantanés Hugging Face
  about: modèles locaux
  note: 'Registre sous virtual_env/trained_models/huggingface : modules/*/huggingface_models.yaml. Ce n''est pas ollama pull ni packages.yaml.'
  commands:
  - name: huggingface-models
    summary: Liste des instantanés huggingface_models.yaml et état sur disque
  - name: runtime-models
    invoke: ergoms runtime-models [--json]
    summary: Index commun des modèles déclarés et des liens locaux vérifiés
  - name: runtime-model-check
    invoke: ergoms runtime-model-check [--json]
    summary: Vérifier les modèles obligatoires sans téléchargement et mettre à jour l'index fichier
  - name: runtime-model-install
    invoke: ergoms runtime-model-install [--include-optional] [--provider NAME --model NAME]
    summary: Installer les modèles avec les chargeurs existants ; par défaut, uniquement les obligatoires
  - name: runtime-model-resolve
    invoke: ergoms runtime-model-resolve --provider NAME --model NAME [--allow-download] [--json]
    summary: Obtenir un lien local vérifié ; le téléchargement n'est permis qu'explicitement
  - name: pull-huggingface-models
    invoke: ergoms pull-huggingface-models [--force] [--repo org/name] [--include-optional]
    summary: Télécharger les instantanés obligatoires (automatique dans setup-full). Ignore ceux déjà présents dans trained_models
