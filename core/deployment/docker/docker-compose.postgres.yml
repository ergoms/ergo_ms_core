# ERGO MS — PostgreSQL (profile: postgres)
services:
  postgres:
    image: ${DOCKER_POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-ergo_ms}
    # Публикация на хост — docker-compose.publish.generated.yml (если порт свободен).
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - ergo_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    depends_on:
      postgres:
        condition: service_healthy

  celery-beat:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: ${DOCKER_COMPOSE_PROJECT:-ergo_ms}_postgres_data
