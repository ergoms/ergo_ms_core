# ERGO MS — dev-override (Vite, bind-mount исходников)
services:
  api:
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"

  media-api:
    ports:
      - "${MEDIA_API_BIND_PORT:-8003}:${MEDIA_API_BIND_PORT:-8003}"

  client:
    image: ${DOCKER_NODE_IMAGE:-ergo_ms-client:local}
    build:
      context: ../..
      dockerfile: core/deployment/docker/Dockerfile.client
    env_file:
      - .compose.env
    working_dir: /app
    volumes:
      - ${ERGO_PROJECT_ROOT:-../..}:/app
      - node_modules:/app/node_modules
      - client_node_modules:/app/core/client/node_modules
    ports:
      - "${CLIENT_PORT:-8001}:${CLIENT_PORT:-8001}"
    networks:
      - ergo_net
    command: >
      sh -c "npm run install:all && npm run dev --prefix core/client -- --host 0.0.0.0 --port ${CLIENT_PORT:-8001}"
    restart: unless-stopped

volumes:
  node_modules:
    name: ${DOCKER_COMPOSE_PROJECT:-ergo_ms}_node_modules
  client_node_modules:
    name: ${DOCKER_COMPOSE_PROJECT:-ergo_ms}_client_node_modules
