# ErgoMS Commands Configuration
# Этот файл позволяет создавать пользовательские команды и алиасы для них.
#
# Формат:
#   command_name=command to execute
#   command_name=command1 && command2 && command3  (для нескольких команд)
#
# Используйте специальные префиксы для указания типа команды:
#   poetry:  - для poetry команд (poetry install, poetry update)
#   api:     - для Django API команд (api migrate, api dev)
#   npm:     - для npm команд в virtual_env/npm (npm install, npm run dev)
#   shell:   - для обычных shell команд (выполняется напрямую)
#   win:     - только для Windows (cmd.exe)
#   linux:   - только для Linux (bash)
#
# Примеры:
#   python-install=api:install
#   db-migrate=api:migrate
#   client-build=npm:run build
#   setup=api:install && npm:install && api:migrate
#   show-info-win=win:systeminfo
#   show-info-linux=linux:uname -a
#   custom-script=shell:echo "Hello World"
#
# После определения команды используйте: ergoms command_name

# Сокращения для часто используемых команд
python-install=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py python-install && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py python-install
python-update=poetry:update
db-migrate=api:migrate
db-makemigrations=api:makemigrations
client-build=npm:run build
client-build-analyze=win:powershell -NoProfile -Command "$env:ANALYZE='true'; $env:PATH=(Join-Path (Get-Location) 'virtual_env\packages\nodejs')+';'+$env:PATH; Set-Location (Join-Path (Get-Location) 'virtual_env\npm'); npm run build -w @ergo-ms/core-client" && linux:bash -c "ANALYZE=true PATH=\"$PWD/virtual_env/packages/nodejs/bin:$PATH\" npm run build -w @ergo-ms/core-client --prefix \"$PWD/virtual_env/npm\""
client-preview=npm:run preview

# Полная настройка проекта (git, venv, poetry, npm, migrate, static) — lifecycle runner.
# Как Invoke-LifecycleRunner: venv если есть, иначе системный Python (первый bootstrap).
setup=win:if exist virtual_env\python\Scripts\python.exe (virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py setup-full) else (py -3.12 core\deployment\lifecycle\runner.py setup-full) && linux:if [ -x virtual_env/python/bin/python ]; then virtual_env/python/bin/python core/deployment/lifecycle/runner.py setup-full; else python3.12 core/deployment/lifecycle/runner.py setup-full; fi

# Быстрая установка зависимостей (требует готовое виртуальное окружение и Poetry)
install-deps=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py install-deps && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py install-deps

# Обновление всех зависимостей
update-all=poetry:update && npm:update

# Создание миграций и их применение
migrate-all=api:makemigrations && api:migrate

# Объединение миграций через squash с проверкой зависимостей
# Использование: ergoms sq-del-migrations <app_label> [start_migration] [end_migration] [--force] [--check-only]
# Пример: ergoms sq-del-migrations cms_shortcodes (объединит все миграции от первой до последней)
# Пример: ergoms sq-del-migrations cms_shortcodes 0002_cmsshortcodetemplate_parent_and_more (от указанной до последней)
# Пример: ergoms sq-del-migrations cms_shortcodes 0002_cmsshortcodetemplate_parent_and_more 0016_alter_cmspage_slug (от start до end)
# Примечание: аргументы передаются автоматически после имени команды
sq-del-migrations=api:sq_del_migrations

# Безопасное удаление приложения (таблицы, данные, миграции)
# Использование: ergoms safe-drop-app <app_label> [--check-only] [--cascade] [--force] [--auto-fix]
# Пример: ergoms safe-drop-app settings --check-only (проверка зависимостей)
# Пример: ergoms safe-drop-app settings --cascade (каскадное удаление данных)
# Пример: ergoms safe-drop-app settings --force (принудительное удаление)
# Пример: ergoms safe-drop-app settings --auto-fix --cascade (авто-удаление ссылок + cascade)
safe-drop-app=api:safe_drop_app

# Сборка проекта
build-all=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py build-all && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py build-all

# Проверка SMTP (конфиг, подключение, отправка тестового письма)
# Использование: ergoms test-smtp [--to=email] [--source=auto|env|db] [--check-only]
test-smtp=api:test_smtp

# Очистка и переустановка зависимостей
reinstall=poetry:install --sync && npm:run install:all

# Проверка lock-файлов: модули не должны попадать в poetry.lock / package-lock.json
lock-check=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\validate_poetry_lock.py && node core\deployment\scripts\validate_npm_lock.js && linux:virtual_env/python/bin/python core/deployment/scripts/validate_poetry_lock.py && node core/deployment/scripts/validate_npm_lock.js

# Проверка ядра на соответствие правилам Cursor (изоляция модулей, SelectBox, logError, …)
core-rules-check=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\validate_core_rules.py && linux:virtual_env/python/bin/python core/deployment/scripts/validate_core_rules.py
ps1-encoding-check=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\validate_ps1_encoding.py && linux:virtual_env/python/bin/python core/deployment/scripts/validate_ps1_encoding.py
sh-encoding-check=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\validate_sh_encoding.py && linux:virtual_env/python/bin/python core/deployment/scripts/validate_sh_encoding.py

# Пересборка package-lock.json только для ядра (после изменения зависимостей в virtual_env/npm/package.json)
npm-lock-refresh=node core/deployment/scripts/refresh-core-package-lock.js

# Очистка package-lock.json от случайно попавших записей модулей
npm-lock-sanitize=node core/deployment/scripts/sanitize-package-lock.js

# Запуск сервисов (режим API — из API_DEPLOY_TYPE: development — runserver/autoreload, production — daphne)
dev=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py dev-api && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py dev-api
start-client=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py start-client && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py start-client
start-client-dev=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py start-client-dev && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py start-client-dev
start-nginx-dev=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\start_nginx_if_enabled.py && linux:virtual_env/python/bin/python core/deployment/scripts/start_nginx_if_enabled.py
ensure-redis-dev=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\ensure_redis_if_enabled.py && linux:virtual_env/python/bin/python core/deployment/scripts/ensure_redis_if_enabled.py
start-redis-dev=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\start_redis_if_enabled.py && linux:virtual_env/python/bin/python core/deployment/scripts/start_redis_if_enabled.py
start-jupyter=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py start-jupyter && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py start-jupyter

# Параллельный запуск всех сервисов для разработки (без системных служб)
# Windows: warmup, затем 5 окон (API, Client, Media API, Worker, Beat). Linux: warmup, затем 5 процессов в фоне, Ctrl+C останавливает все
start-all=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\start_all_dev.py && linux:virtual_env/python/bin/python core/deployment/scripts/start_all_dev.py

# Прогрев кэшей (discovered_apps, celery_routes_queues, celery_queues, modules_env) для быстрого старта
warmup-caches=api:warmup_caches
# Инвалидация кэшей ядра (файловые + Django). Цели: ergoms api clear_cache --help
invalidate-caches=api:clear_cache --targets=all
invalidate-caches-warmup=api:clear_cache --targets=all --warmup
# Прогрев только celery-кэшей (быстрее, без modules_env)
warmup-celery=api:warmup_celery

# Восстановление меню из populate-функций миграций (core + все установленные модули)
# Использование: ergoms restore-menu [--core-only] [--module=name] [--dry-run]
restore-menu=api:restore_menu
# Прогрев только при пустом/устаревшем кэше (без Django, если кэш валиден)
warmup-caches-if-needed=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py warmup-caches-if-needed && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py warmup-caches-if-needed
sync-logs-services=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py sync-logs-services && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py sync-logs-services
# Ротация nginx/redis/client-dev по ERGO_LOG_INFRA_* / ERGO_LOG_NGINX_* / ERGO_LOG_REDIS_*
rotate-logs=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\rotate_infra_logs.py && linux:virtual_env/python/bin/python core/deployment/scripts/rotate_infra_logs.py
install-infra-log-rotate=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\install_infra_log_rotate.py && linux:virtual_env/python/bin/python core/deployment/scripts/install_infra_log_rotate.py

# GeoIP (DB-IP City Lite, локальный MMDB в virtual_env/resources/geoip/)
# Конфиг: GEOIP_ENABLED, GEOIP_DOWNLOAD_URL в .env (см. .env.example)
# Использование: ergoms geoip-download
#                ergoms geoip-backfill [--dry-run] [--batch-size=500]
geoip-download=api:download_geoip_db
geoip-backfill=api:backfill_device_locations

# Режим технических works (флаг maintenance.flag; переключение без перезапуска сервисов)
maintenance-on=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\maintenance_mode.py on && linux:virtual_env/python/bin/python core/deployment/scripts/maintenance_mode.py on
maintenance-off=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\maintenance_mode.py off && linux:virtual_env/python/bin/python core/deployment/scripts/maintenance_mode.py off
maintenance-status=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\maintenance_mode.py status && linux:virtual_env/python/bin/python core/deployment/scripts/maintenance_mode.py status
resource-usage=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\resource_usage.py && linux:virtual_env/python/bin/python core/deployment/scripts/resource_usage.py

# Сверка .env с .env.example (корень + модули)
# Использование: ergoms env [--show-example-values] [--strict]
env=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\env_check.py && linux:virtual_env/python/bin/python core/deployment/scripts/env_check.py

# Нормализация .env по .env.example (сохраняет существующие значения)
# Использование: ergoms env-normalize [--dry-run] [--drop-extra] [--no-backup] [--only=PATH]
env-normalize=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\env_normalize.py && linux:virtual_env/python/bin/python core/deployment/scripts/env_normalize.py

# MCP для Cursor: список и сборка .cursor/mcp.json из реестра и modules/*/mcp/manifest.yaml
mcp-list=win:virtual_env\python\Scripts\python.exe .cursor\mcp_sync.py list && linux:virtual_env/python/bin/python .cursor/mcp_sync.py list
mcp-sync=win:virtual_env\python\Scripts\python.exe .cursor\mcp_sync.py sync && linux:virtual_env/python/bin/python .cursor/mcp_sync.py sync

# Очистка Python кэша (__pycache__) без запуска Django
clear-pycache=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\clear_pycache.py && linux:virtual_env/python/bin/python core/deployment/scripts/clear_pycache.py
clean-pycache=win:virtual_env\python\Scripts\python.exe core\deployment\scripts\clear_pycache.py && linux:virtual_env/python/bin/python core/deployment/scripts/clear_pycache.py

# Запуск/остановка Celery (все воркеры из конфига celery_workers.yaml)
start-worker=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py start-worker && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py start-worker
start-beat=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py start-beat && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py start-beat
stop-beat=api:stop_celery_beat
stop-worker=api:stop_celery_worker --all

# Запуск Media API (CDN / file server)
start-media=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py start-media && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py start-media

# Запуск API (режим из API_DEPLOY_TYPE: development — dev/runserver, production — daphne)
start-api=win:virtual_env\python\Scripts\python.exe core\api\scripts\start_api.py && linux:virtual_env/python/bin/python core/api/scripts/start_api.py

# Установка служб (требуют права администратора/root)
# Эти команды устанавливают службы для всех воркеров из celery_workers.yaml
# install-api-service, install-client-service и т.д. — встроены в ergo_ms.ps1/ergo_ms.sh
#
# ВАЖНО: Имена служб Windows — ergo-api-dev, ergo-client-dev, ergo-celery-worker-all и т.д.
# (см. core/deployment/windows/lib/core.ps1). Linux — ergo-api-dev, ergo-celery-worker-all, …
# Для ручного управления отдельными worker'ами используйте:
#   ergoms start-worker --worker=<name>
#   ergoms api stop_celery_worker --worker=<name>
install-all-services=win:ergoms install-services && linux:ergoms install-services

# Запуск служб (lifecycle runner)
start-api-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-start-api && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-start-api
start-client-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-start-client && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-start-client
start-worker-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-start-workers && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-start-workers
start-beat-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-start-beat && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-start-beat
start-media-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-start-media && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-start-media
start-all-services=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-start-all && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-start-all

# Остановка служб
stop-api-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-stop-api && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-stop-api
stop-client-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-stop-client && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-stop-client
stop-worker-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-stop-workers && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-stop-workers
stop-beat-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-stop-beat && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-stop-beat
stop-media-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-stop-media && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-stop-media
stop-all-services=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-stop-all && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-stop-all

# Перезапуск служб
restart-api-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-restart-api && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-restart-api
restart-client-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-restart-client && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-restart-client
restart-worker-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-restart-workers && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-restart-workers
restart-beat-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-restart-beat && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-restart-beat
restart-media-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-restart-media && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-restart-media
restart-all-services=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-restart-all && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-restart-all

# Статус служб
status-api-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-status-api && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-status-api
status-client-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-status-client && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-status-client
status-worker-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-status-workers && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-status-workers
status-beat-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-status-beat && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-status-beat
status-media-service=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-status-media && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-status-media
status-all-services=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py service-status-all && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py service-status-all

# Сбор статики
collectstatic=api:collectstatic --noinput

# Установка и удаление CLI обёртки (независимая установка, не требует ergoms)
install-cli=win:powershell -ExecutionPolicy Bypass -File core/deployment/windows/ergo_ms.ps1 install-cli && linux:bash core/deployment/linux/ergo_ms.sh install-cli
uninstall-cli=win:powershell -ExecutionPolicy Bypass -File core/deployment/windows/ergo_ms.ps1 uninstall-cli && linux:bash core/deployment/linux/ergo_ms.sh uninstall-cli

# Команды для работы с VS Code расширениями
install-extensions=win:node .vscode\scripts\install-extensions.js && linux:node .vscode/scripts/install-extensions.js
update-vsix=win:node .vscode\scripts\update-vsix.js && linux:node .vscode/scripts/update-vsix.js
uninstall-extensions=win:node .vscode\scripts\uninstall-extensions.js && linux:node .vscode/scripts/uninstall-extensions.js

# Команды для развертывания отдельных компонентов
# Развертывание только API (обновление субмодуля, установка зависимостей, миграции, сбор статики)
deploy-api=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py deploy-api && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py deploy-api

# Развертывание только клиента (обновление субмодуля, установка зависимостей, сбор)
deploy-client=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py deploy-client && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py deploy-client

# Развертывание API с запуском в режиме разработки
deploy-api-dev=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py deploy-api && win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py dev-api && linux:bash -c "virtual_env/python/bin/python core/deployment/lifecycle/runner.py deploy-api && virtual_env/python/bin/python core/deployment/lifecycle/runner.py dev-api"

# Развертывание клиента с запуском в режиме разработки
deploy-client-dev=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py deploy-client && npm:run dev && linux:bash -c "virtual_env/python/bin/python core/deployment/lifecycle/runner.py deploy-client && npm run dev --prefix virtual_env/npm"

# Полное развертывание системы
deploy-all=win:virtual_env\python\Scripts\python.exe core\deployment\lifecycle\runner.py deploy-all && linux:virtual_env/python/bin/python core/deployment/lifecycle/runner.py deploy-all

# Очистка проекта (удаление библиотек, static файлов, виртуального окружения, кроме media)
clean=win:powershell -ExecutionPolicy Bypass -File core/deployment/windows/ergo_ms.ps1 clean && linux:bash core/deployment/linux/ergo_ms.sh clean

deps=api:deps

# Docker Compose (ergoms docker *)
docker-up=win:virtual_env\python\Scripts\python.exe core\deployment\docker\docker_cli.py up && linux:virtual_env/python/bin/python core/deployment/docker/docker_cli.py up
docker-down=win:virtual_env\python\Scripts\python.exe core\deployment\docker\docker_cli.py down && linux:virtual_env/python/bin/python core/deployment/docker/docker_cli.py down
docker-restart=win:virtual_env\python\Scripts\python.exe core\deployment\docker\docker_cli.py down && win:virtual_env\python\Scripts\python.exe core\deployment\docker\docker_cli.py up && linux:bash -c "virtual_env/python/bin/python core/deployment/docker/docker_cli.py down && virtual_env/python/bin/python core/deployment/docker/docker_cli.py up"
docker-ps=win:virtual_env\python\Scripts\python.exe core\deployment\docker\docker_cli.py ps && linux:virtual_env/python/bin/python core/deployment/docker/docker_cli.py ps
