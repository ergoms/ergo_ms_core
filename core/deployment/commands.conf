# ErgoMS Commands Configuration
# Этот файл позволяет создавать пользовательские команды и алиасы для них.
#
# Формат:
#   command_name=command to execute
#   command_name=command1 && command2 && command3  (для нескольких команд)
#
# Используйте специальные префиксы для указания типа команды:
#   poetry:  - для poetry команд (poetry install, poetry update)
#   api:     - для Django API команд (api migrate, api dev)
#   npm:     - для npm команд (npm install, npm run dev)
#   shell:   - для обычных shell команд (выполняется напрямую)
#   win:     - только для Windows (cmd.exe)
#   linux:   - только для Linux (bash)
#
# Примеры:
#   python-install=api:install
#   db-migrate=api:migrate
#   client-build=npm:run build
#   setup=api:install && npm:install && api:migrate
#   show-info-win=win:systeminfo
#   show-info-linux=linux:uname -a
#   custom-script=shell:echo "Hello World"
#
# После определения команды используйте: ergoms command_name

# Сокращения для часто используемых команд
python-install=api:install
python-update=poetry:update
db-migrate=api:migrate
db-makemigrations=api:makemigrations
client-build=npm:run build
client-preview=npm:run preview

# Полная настройка проекта (git, venv, poetry, npm, migrate, static, extensions)
setup=win:powershell -File core/deployment/windows/ergo_ms.ps1 setup-full && linux:bash core/deployment/linux/ergo_ms.sh setup-full

# Быстрая установка зависимостей (требует готовое виртуальное окружение и Poetry)
install-deps=api:install && npm:run install:all && api:migrate && api:warmup_caches

# Обновление всех зависимостей
update-all=poetry:update && npm:update

# Создание миграций и их применение
migrate-all=api:makemigrations && api:migrate

# Объединение миграций через squash с проверкой зависимостей
# Использование: ergoms sq-del-migrations <app_label> [start_migration] [end_migration] [--force] [--check-only]
# Пример: ergoms sq-del-migrations cms_shortcodes (объединит все миграции от первой до последней)
# Пример: ergoms sq-del-migrations cms_shortcodes 0002_cmsshortcodetemplate_parent_and_more (от указанной до последней)
# Пример: ergoms sq-del-migrations cms_shortcodes 0002_cmsshortcodetemplate_parent_and_more 0016_alter_cmspage_slug (от start до end)
# Примечание: аргументы передаются автоматически после имени команды
sq-del-migrations=api:sq_del_migrations

# Безопасное удаление приложения (таблицы, данные, миграции)
# Использование: ergoms safe-drop-app <app_label> [--check-only] [--cascade] [--force] [--auto-fix]
# Пример: ergoms safe-drop-app settings --check-only (проверка зависимостей)
# Пример: ergoms safe-drop-app settings --cascade (каскадное удаление данных)
# Пример: ergoms safe-drop-app settings --force (принудительное удаление)
# Пример: ergoms safe-drop-app settings --auto-fix --cascade (авто-удаление ссылок + cascade)
safe-drop-app=api:safe_drop_app

# Сборка проекта
build-all=npm:run build && api:collectstatic --noinput

# Тестирование навыков AI ассистента
test-skills=api:test_skills

# Проверка SMTP (конфиг, подключение, отправка тестового письма)
# Использование: ergoms test-smtp [--to=email] [--source=auto|env|db] [--check-only]
test-smtp=api:test_smtp

# Очистка и переустановка зависимостей
reinstall=poetry:install --sync && npm:ci

# Запуск сервисов
dev=win:virtual_env\python\Scripts\python.exe core\api\scripts\warmup_caches_if_needed.py && linux:virtual_env/python/bin/python core/api/scripts/warmup_caches_if_needed.py && api:dev
start-client=npm:run dev
start-jupyter=win:virtual_env\python\Scripts\python.exe core\api\scripts\start_jupyter.py && linux:virtual_env/python/bin/python core/api/scripts/start_jupyter.py

# Параллельный запуск API, Celery worker и Beat из одного терминала (dev без служб)
# Windows: warmup, затем 3 окна (API, Worker, Beat). Linux: warmup, затем 3 процесса в фоне, Ctrl+C останавливает все
start-all=win:virtual_env\python\Scripts\python.exe core\api\scripts\warmup_caches_if_needed.py & start "API" cmd /c "ergoms dev" & start "Worker" cmd /c "ergoms start-worker" & start "Beat" cmd /c "ergoms start-beat" && linux:bash -c "virtual_env/python/bin/python core/api/scripts/warmup_caches_if_needed.py && (ergoms dev & ergoms start-worker & ergoms start-beat; wait)"

# Прогрев кэшей (discovered_apps, celery_routes_queues, celery_queues, modules_env) для быстрого старта
warmup-caches=api:warmup_caches
# Прогрев только celery-кэшей (быстрее, без modules_env)
warmup-celery=api:warmup_celery

# Восстановление меню из populate-функций миграций (core + все установленные модули)
# Использование: ergoms restore-menu [--core-only] [--module=name] [--dry-run]
restore-menu=api:restore_menu
# Прогрев только при пустом/устаревшем кэше (без Django, если кэш валиден)
warmup-caches-if-needed=win:virtual_env\python\Scripts\python.exe core\api\scripts\warmup_caches_if_needed.py && linux:virtual_env/python/bin/python core/api/scripts/warmup_caches_if_needed.py

# Очистка Python кэша (__pycache__) без запуска Django
clear-pycache=win:powershell -NoProfile -Command "Get-ChildItem -Path . -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force" && linux:find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null; true

# Запуск/остановка Celery (все воркеры из конфига celery_workers.yaml)
start-worker=win:virtual_env\python\Scripts\python.exe core\api\scripts\start_celery_worker.py && linux:virtual_env/python/bin/python core/api/scripts/start_celery_worker.py
start-beat=win:virtual_env\python\Scripts\python.exe core\api\scripts\start_celery_beat.py && linux:virtual_env/python/bin/python core/api/scripts/start_celery_beat.py
stop-beat=api:stop_celery_beat
stop-worker=api:stop_celery_worker --all

# Запуск/остановка Media API (CDN / file server)
start-media=media_api:runserver 0.0.0.0:8003

ollama=api:ollama
stop-ollama=api:stop_ollama

# Установка и удаление Ollama
install-ollama=api:install_ollama
uninstall-ollama=api:uninstall_ollama

# Установка служб (требуют права администратора/root)
# Эти команды устанавливают службы для всех воркеров из celery_workers.yaml
# install-api-service, install-client-service и т.д. — встроены в ergo_ms.ps1/ergo_ms.sh
#
# ВАЖНО: Имена служб ниже (ergo_ms_worker / ergo-celery-worker-all) соответствуют
# конфигурации по умолчанию с одним worker'ом "all". При добавлении нескольких worker'ов
# в celery_workers.yaml необходимо пересоздать службы через ergoms install-services.
# Для ручного управления отдельными worker'ами используйте:
#   ergoms start-worker --worker=<name>
#   ergoms api stop_celery_worker --worker=<name>
install-all-services=win:ergoms install-services && linux:ergoms install-services

# Запуск служб (требуют права администратора/root)
start-api-service=win:net start ergo_ms_api && linux:systemctl start ergo-api-dev
start-client-service=win:net start ergo_ms_client && linux:systemctl start ergo-client-dev
start-worker-service=win:net start ergo_ms_worker && linux:systemctl start ergo-celery-worker-all
start-beat-service=win:net start ergo_ms_beat && linux:systemctl start ergo-celery-beat
start-ollama-service=win:net start ollama && linux:systemctl start ollama
start-media-service=win:net start ergo_ms_media && linux:systemctl start ergo-media-api
start-all-services=win:net start ergo_ms_api && net start ergo_ms_client && net start ergo_ms_worker && net start ergo_ms_beat && net start ergo_ms_media && net start ollama && linux:systemctl start ergo-api-dev ergo-client-dev ergo-celery-worker-all ergo-celery-beat ergo-media-api ollama

# Остановка служб (требуют права администратора/root)
stop-api-service=win:net stop ergo_ms_api && linux:systemctl stop ergo-api-dev
stop-client-service=win:net stop ergo_ms_client && linux:systemctl stop ergo-client-dev
stop-worker-service=win:net stop ergo_ms_worker && linux:systemctl stop ergo-celery-worker-all
stop-beat-service=win:net stop ergo_ms_beat && linux:systemctl stop ergo-celery-beat
stop-ollama-service=win:net stop ollama && linux:systemctl stop ollama
stop-media-service=win:net stop ergo_ms_media && linux:systemctl stop ergo-media-api
stop-all-services=win:net stop ollama && net stop ergo_ms_beat && net stop ergo_ms_worker && net stop ergo_ms_media && net stop ergo_ms_client && net stop ergo_ms_api && linux:systemctl stop ollama ergo-celery-beat ergo-celery-worker-all ergo-media-api ergo-client-dev ergo-api-dev

# Перезапуск служб (требуют права администратора/root)
restart-api-service=win:net stop ergo_ms_api && net start ergo_ms_api && linux:systemctl restart ergo-api-dev
restart-client-service=win:net stop ergo_ms_client && net start ergo_ms_client && linux:systemctl restart ergo-client-dev
restart-worker-service=win:net stop ergo_ms_worker && net start ergo_ms_worker && linux:systemctl restart ergo-celery-worker-all
restart-beat-service=win:net stop ergo_ms_beat && net start ergo_ms_beat && linux:systemctl restart ergo-celery-beat
restart-ollama-service=win:net stop ollama && net start ollama && linux:systemctl restart ollama
restart-media-service=win:net stop ergo_ms_media && net start ergo_ms_media && linux:systemctl restart ergo-media-api
restart-all-services=win:net stop ollama && net stop ergo_ms_beat && net stop ergo_ms_worker && net stop ergo_ms_media && net stop ergo_ms_client && net stop ergo_ms_api && net start ergo_ms_api && net start ergo_ms_client && net start ergo_ms_worker && net start ergo_ms_media && net start ergo_ms_beat && net start ollama && linux:systemctl restart ergo-api-dev ergo-client-dev ergo-celery-worker-all ergo-media-api ergo-celery-beat ollama

# Статус служб
status-api-service=win:sc query ergo_ms_api && linux:systemctl status ergo-api-dev
status-client-service=win:sc query ergo_ms_client && linux:systemctl status ergo-client-dev
status-worker-service=win:sc query ergo_ms_worker && linux:systemctl status ergo-celery-worker-all
status-beat-service=win:sc query ergo_ms_beat && linux:systemctl status ergo-celery-beat
status-ollama-service=win:sc query ollama && linux:systemctl status ollama
status-media-service=win:sc query ergo_ms_media && linux:systemctl status ergo-media-api
status-all-services=win:sc query ergo_ms_api && sc query ergo_ms_client && sc query ergo_ms_worker && sc query ergo_ms_beat && sc query ergo_ms_media && sc query ollama && linux:systemctl status ergo-api-dev ergo-client-dev ergo-celery-worker-all ergo-celery-beat ergo-media-api ollama

# Сбор статики
collectstatic=api:collectstatic --noinput

# Установка и удаление CLI обёртки (независимая установка, не требует ergoms)
install-cli=win:powershell -ExecutionPolicy Bypass -File core/deployment/windows/ergo_ms.ps1 install-cli && linux:bash core/deployment/linux/ergo_ms.sh install-cli
uninstall-cli=win:powershell -ExecutionPolicy Bypass -File core/deployment/windows/ergo_ms.ps1 uninstall-cli && linux:bash core/deployment/linux/ergo_ms.sh uninstall-cli

# Команды для работы с VS Code расширениями
install-extensions=npm:run install-extensions
update-vsix=npm:run update-vsix
uninstall-extensions=npm:run uninstall-extensions

# Команды для развертывания отдельных компонентов
# Развертывание только API (обновление субмодуля, установка зависимостей, миграции, сбор статики)
deploy-api=shell:git submodule update --init --remote core/api core/django core/django_rest_framework core/media_api && shell:cd core/api && git checkout dev && shell:cd ../django && git checkout dev && shell:cd ../django_rest_framework && git checkout dev && shell:cd ../media_api && git checkout dev && shell:cd ../.. && api:install && api:migrate && api:warmup_caches && api:collectstatic --noinput

# Развертывание только клиента (обновление субмодуля, установка зависимостей, сбор)
deploy-client=shell:git submodule update --init --remote core/client && shell:cd core/client && git checkout dev && shell:cd ../.. && npm:run install:all && npm:run build

# Развертывание API с запуском в режиме разработки
deploy-api-dev=shell:git submodule update --init --remote core/api core/django core/django_rest_framework core/media_api && shell:cd core/api && git checkout dev && shell:cd ../django && git checkout dev && shell:cd ../django_rest_framework && git checkout dev && shell:cd ../media_api && git checkout dev && shell:cd ../.. && api:install && api:migrate && api:warmup_caches && api:collectstatic --noinput && api:dev

# Развертывание клиента с запуском в режиме разработки
deploy-client-dev=shell:git submodule update --init --remote core/client && shell:cd core/client && git checkout dev && shell:cd ../.. && npm:run install:all && npm:run dev

# Полное развертывание системы
deploy-all=shell:git submodule update --init --remote core/api core/client core/django core/django_rest_framework core/media_api && shell:cd core/api && git checkout dev && shell:cd ../client && git checkout dev && shell:cd ../django && git checkout dev && shell:cd ../django_rest_framework && git checkout dev && shell:cd ../media_api && git checkout dev && shell:cd ../.. && api:install && npm:run install:all && api:migrate && api:warmup_caches && api:collectstatic --noinput && npm:run build

# Очистка проекта (удаление библиотек, static файлов, виртуального окружения, кроме media)
clean=win:powershell -ExecutionPolicy Bypass -File core/deployment/windows/ergo_ms.ps1 clean && linux:bash core/deployment/linux/ergo_ms.sh clean

# Тестирование системы (оркестратор тестов под ОС)
test_system=win:powershell -NoProfile -ExecutionPolicy Bypass -File core/deployment/windows/lib/test/test.ps1 && linux:bash core/deployment/linux/lib/test/test.sh
deps=api:deps
