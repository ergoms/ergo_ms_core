<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Технические работы — ERGOMS</title>
  <style>
    :root {
      --maint-bg: #f5f6f8;
      --maint-surface: rgba(255, 255, 255, 0.92);
      --maint-text: #14151a;
      --maint-muted: #5b616e;
      --maint-accent: #d0322d;
      --maint-accent-soft: rgba(208, 50, 45, 0.12);
      --maint-accent-glow: rgba(208, 50, 45, 0.2);
      --maint-border: rgba(17, 18, 35, 0.14);
      --maint-surface-2: #f1f3f5;
      --maint-info-soft: rgba(13, 110, 253, 0.18);
      --maint-warning-soft: rgba(255, 193, 7, 0.16);
      --maint-shadow: 0 8px 24px rgba(17, 18, 35, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --maint-bg: #0e0e11;
        --maint-surface: rgba(23, 24, 27, 0.94);
        --maint-text: rgba(255, 255, 255, 0.92);
        --maint-muted: rgba(255, 255, 255, 0.56);
        --maint-accent: #f14336;
        --maint-accent-soft: rgba(241, 67, 54, 0.16);
        --maint-accent-glow: rgba(241, 67, 54, 0.22);
        --maint-border: rgba(255, 255, 255, 0.14);
        --maint-surface-2: #202126;
        --maint-info-soft: rgba(96, 165, 250, 0.14);
        --maint-warning-soft: rgba(251, 191, 36, 0.12);
        --maint-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--maint-bg);
      color: var(--maint-text);
    }

    .page {
      position: relative;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 4vw, 2.5rem);
      overflow: hidden;
      animation: page-in 0.4s ease forwards;
    }

    .backdrop {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(64px);
      opacity: 0.55;
      animation: float 14s ease-in-out infinite;
    }

    .orb--1 {
      top: -8%;
      left: -6%;
      width: min(42vw, 320px);
      height: min(42vw, 320px);
      background: var(--maint-accent-glow);
    }

    .orb--2 {
      right: -4%;
      bottom: -10%;
      width: min(48vw, 360px);
      height: min(48vw, 360px);
      background: var(--maint-info-soft);
      animation-delay: -4s;
    }

    .orb--3 {
      top: 38%;
      right: 18%;
      width: min(28vw, 200px);
      height: min(28vw, 200px);
      background: var(--maint-warning-soft);
      animation-delay: -8s;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 28rem);
      padding: clamp(1.5rem, 5vw, 2.25rem);
      text-align: center;
      background: var(--maint-surface);
      border: 1px solid var(--maint-border);
      border-radius: 14px;
      box-shadow: var(--maint-shadow);
      backdrop-filter: blur(12px);
      animation: card-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
    }

    .wordmark {
      display: block;
      width: min(100%, 17.5rem);
      height: auto;
      margin: 0 auto 1.25rem;
      color: var(--maint-text);
    }

    .wordmark__cog {
      fill: none;
      stroke: var(--maint-accent);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 240px 66px;
      animation: cog 8s linear infinite;
    }

    .badge {
      display: inline-block;
      margin: 0 0 0.75rem;
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--maint-accent);
      background: var(--maint-accent-soft);
      border-radius: 999px;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.5rem, 4.5vw, 1.875rem);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .text {
      margin: 0;
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      line-height: 1.65;
      color: var(--maint-muted);
    }

    .progress {
      height: 4px;
      margin: 1.5rem 0 1rem;
      overflow: hidden;
      background: var(--maint-surface-2);
      border-radius: 999px;
    }

    .progress-bar {
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--maint-accent), transparent);
      border-radius: inherit;
      animation: progress 1.8s ease-in-out infinite;
    }

    .hint {
      margin: 0;
      font-size: 0.8125rem;
      line-height: 1.5;
      color: var(--maint-muted);
      opacity: 0.85;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(2%, -3%) scale(1.04); }
    }

    @keyframes cog {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes progress {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    @keyframes page-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .page, .card { animation: none; }
      .orb, .wordmark__cog, .progress-bar { animation: none; }
    }
  </style>
</head>

      <p class="badge">Технические работы</p>
      <h1>Скоро вернёмся</h1>
      <p class="text">Система временно недоступна. Мы проводим обновление и скоро вернёмся.</p>

      <div class="progress" aria-hidden="true">
        <span class="progress-bar"></span>
      </div>

      <p class="hint">Страница обновится автоматически, когда система снова станет доступна.</p>

  </main>
  <script>
    (function () {
      // Синхронизировать с core/client/src/js/maintenanceConfig.js
      var pollMs = 3000;
      var pollTimer = null;

      function reloadWhenAvailable() {
        window.location.reload();
      }

      function normalizePollInterval(value) {
        var parsed = Number(value);
        if (!Number.isFinite(parsed) || parsed < 1000 || parsed > 60000) {
          return pollMs;
        }
        return parsed;
      }

      function schedulePolling() {
        if (pollTimer !== null) {
          window.clearInterval(pollTimer);
        }
        pollTimer = window.setInterval(checkMaintenanceStatus, pollMs);
      }

      function applyPollInterval(data) {
        var next = normalizePollInterval(data && data.pollIntervalMs);
        if (next === pollMs) {
          return;
        }
        pollMs = next;
        schedulePolling();
      }

      function checkMaintenanceStatus() {
        return fetch('/maintenance.json?_=' + Date.now(), {
          cache: 'no-store',
          headers: { Accept: 'application/json' },
        }).then(function (response) {
          if (!response.ok) {
            return;
          }
          return response.json().then(function (data) {
            applyPollInterval(data);
            if (!data || !data.maintenance) {
              reloadWhenAvailable();
            }
          });
        }).catch(function () {
          /* API/статика недоступны — остаёмся на заглушке */
        });
      }

      void checkMaintenanceStatus().finally(function () {
        schedulePolling();
      });

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          void checkMaintenanceStatus();
        }
      });
    })();
  </script>
