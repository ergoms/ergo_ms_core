# Режим технических works (ergoms maintenance-on / maintenance-off).
# Подключается в server-блоке шаблонов ergo_ms*.conf.template.
# ${ERGO_ROOT} подставляется при render_nginx_config.py.

set $maintenance 0;
if (-f ${ERGO_ROOT}/maintenance.flag) {
    set $maintenance 1;
}

error_page 503 @maintenance_page;

location @maintenance_page {
    root ${ERGO_ROOT}/core/deployment/nginx/maintenance;
    rewrite ^ /index.html break;
    add_header X-Maintenance-Mode 1 always;
    add_header Retry-After 3600 always;
    add_header Cache-Control "no-store" always;
}
