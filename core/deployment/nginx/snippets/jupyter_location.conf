# Location JupyterLab (внутри server {}). auth_request — глобальный админ ERGO MS.
    location ${ERGO_JUPYTER_BASE_PATH} {
        if ($maintenance = 1) { return 503; }
        auth_request /api/internal/jupyter-access/;
        limit_conn ergo_conn 10;
        proxy_pass http://ergo_jupyter;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
