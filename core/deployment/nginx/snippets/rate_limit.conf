# Зоны rate limit (http-контекст). Подключать до server {} в шаблоне сайта.
limit_req_zone $binary_remote_addr zone=ergo_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ergo_serve:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ergo_upload:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=ergo_conn:10m;
