# Зоны ограничения частоты (http-контекст).
# Частота ergo_upload подставляется при сборке (upload_rate.build_rate_limit_conf)
# из MEDIA_API_UPLOAD_RATE_ADMIN. Не подключайте сниппет через include без подстановки
# ERGO_UPLOAD_ZONE_RATE — в шаблонах вставляется готовый блок ERGO_RATE_LIMIT_CONF.
limit_req_zone $binary_remote_addr zone=ergo_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ergo_serve:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ergo_upload:10m rate=${ERGO_UPLOAD_ZONE_RATE};
limit_conn_zone $binary_remote_addr zone=ergo_conn:10m;
