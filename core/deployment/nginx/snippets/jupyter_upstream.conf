# JupyterLab за nginx: upstream + location с auth_request и WebSocket.
# Подставляется render_nginx_config.py при API_JUPYTER_BEHIND_NGINX=true.
#
# Плейсхолдеры:
#   ${ERGO_JUPYTER_BIND_PORT} — порт процесса Jupyter (по умолчанию 8002)
#   ${ERGO_JUPYTER_BASE_PATH} — ServerApp.base_url (по умолчанию /jupyter/)

upstream ergo_jupyter {
    server 127.0.0.1:${ERGO_JUPYTER_BIND_PORT};
    keepalive 4;
}
