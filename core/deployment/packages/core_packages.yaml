# Portable-пакеты ядра → virtual_env/packages/<dest>
# Модульные пакеты — modules/<name>/packages.yaml (discovery через ModuleCatalog).

packages:
  nssm:
    kind: archive
    dest: nssm
    version: "2.24"
    platforms:
      windows:
        url: "https://nssm.cc/release/nssm-2.24.zip"
        archive: zip
        pick:
          match: "**/win64/nssm.exe"
          as: nssm.exe
        marker: nssm.exe

  python:
    kind: custom
    dest: python
    version: "3.12"
    installer: lifecycle/runner.py
    installer_args: [install-python-runtime]
    pass_root: false
    marker_windows: python.exe
    marker_linux: bin/python3

  nodejs:
    kind: custom
    dest: nodejs
    installer: lifecycle/runner.py
    installer_args: [install-nodejs]
    pass_root: false
    marker_windows: node.exe
    marker_linux: bin/node

  redis:
    kind: custom
    dest: redis
    version: "7.4"
    installer: scripts/install_redis.py
    marker_windows: redis-server.exe
    marker_linux: bin/redis-server

  nginx:
    kind: custom
    dest: nginx
    version: "1.27.4"
    installer: lifecycle/runner.py
    installer_args: [nginx-install]
    pass_root: false
    marker_windows: nginx.exe
    marker_linux: sbin/nginx

  postgres:
    kind: custom
    dest: postgres
    installer: scripts/install_postgres.py
    marker_windows: VERSION
    marker_linux: VERSION

  meilisearch:
    kind: custom
    dest: meilisearch
    version: "1.43.1"
    installer: scripts/install_meilisearch.py
    installer_args: [install]
    pass_root: true
    marker_windows: meilisearch.exe
    marker_linux: meilisearch

  libreoffice:
    kind: custom
    dest: libreoffice
    version: "25.8.7"
    installer: packages/installers/libreoffice.py
    always_run: true
    supports_refresh: true
    supported_platforms: [windows, linux]
    marker_windows: program/soffice.exe
    marker_linux: program/soffice

  ollama:
    kind: custom
    dest: ollama
    installer: packages/installers/ollama.py
    supports_refresh: true
    supported_platforms: [windows, linux]
    marker_windows: ollama.exe
    marker_linux: ollama
    extra_dirs: [ollama_models]

  tesseract:
    kind: custom
    dest: tesseract
    version: "5.5.3"
    installer: packages/installers/tesseract.py
    supports_refresh: true
    supported_platforms: [windows, linux]
    marker_windows: tesseract.exe
    marker_linux: bin/tesseract
    minimum_sizes:
      tesseract.exe: 1025
      bin/tesseract: 1025
      tessdata/rus.traineddata: 1024
      tessdata/eng.traineddata: 1024
    required_files:
      windows: [tessdata/rus.traineddata, tessdata/eng.traineddata]
      linux: [tessdata/rus.traineddata, tessdata/eng.traineddata]

  chrome-for-testing:
    kind: custom
    dest: chrome-for-testing
    installer: packages/installers/chrome.py
    supports_refresh: true
    swarm_worker: true
    supported_platforms: [windows, linux]
    marker_windows: VERSION
    marker_linux: VERSION
    required_files:
      windows:
        - [chrome/chrome.exe, chrome-win64/chrome.exe]
        - [chromedriver/chromedriver.exe, chromedriver-win64/chromedriver.exe]
      linux:
        - [chrome/chrome, chrome-linux64/chrome]
        - [chromedriver/chromedriver, chromedriver-linux64/chromedriver]
