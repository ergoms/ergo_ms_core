# Конфигурация базовых сервисов ErgoMS для VS Code tasks
# Используется расширением multi-terminal для генерации терминалов логов
# Воркеры берутся автоматически из celery_workers.yaml

services:
  ergo-api-dev:
    description: "Django API server"
  ergo-client-dev:
    description: "Vue.js client dev server"
  media_api:
    description: "Media API (CDN / file server)"
  ergo-celery-beat:
    description: "Celery Beat scheduler"
  ergo-ollama:
    description: "Ollama server"