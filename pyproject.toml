[tool.poetry]
name = "ergo_ms_api"
version = "0.1.0"
description = "Ergo MS API"
authors = ["Eugene Sergeevich Muzalevsky <muzalevskij.evgenij@mail.ru>"]
packages = [
    {include = "src", from = "core/api"},
    {include = "media_server", from = "core/media_api/src"},
    {include = "modules", from = ""},
    {include = "commands", from = "core/api"},
    {include = "rest_framework", from = "core/django_rest_framework"},
    {include = "django", from = "core/django"},
    {include = ".cursor", from = ""},
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
django = {path = "core/django", develop = true}
djangorestframework = {path = "core/django_rest_framework", develop = true}
django-cors-headers = ">=4.7.0"
djangorestframework-simplejwt = ">=5.5.0"
drf-yasg = ">=1.21.10"
numpy = ">=2.1.3"
pandas = ">=2.3.1"
setuptools = ">=80.9.0"
wheel = ">=0.45.1"
daphne = ">=4.2.1"
whitenoise = ">=6.9.0"
psycopg2 = ">=2.9.10"
psutil = ">=7.0.0"
transformers = ">=4.53.2"
django-environ = ">=0.12.0"
matplotlib = ">=3.10.3"
scikit-learn = ">=1.7.0"
pyyaml = ">=6.0.2"
sqlalchemy = ">=2.0.41"
sshtunnel = ">=0.4.0"
pyodbc = ">=5.2.0"
mysql-connector-python = ">=9.3.0"
celery = ">=5.5.3"
flower = ">=2.0.1"
mysqlclient = ">=2.2.7"
django-celery-beat = ">=2.8.1"
channels = ">=4.2.2"
ipykernel = ">=6.29.5"
tensorflow = ">=2.19.0"
pymssql = ">=2.3.7"
clickhouse-connect = ">=0.8.18"
openpyxl = ">=3.1.5"
django-filter = ">=25.1"
feedparser = ">=6.0.11"
python-slugify = ">=8.0.4"
reportlab = ">=4.4.2,<5.0.0"
xlsxwriter = ">=3.2.5,<4.0.0"
docx = ">=0.2.4,<0.3.0"
python-docx = ">=1.2.0,<2.0.0"
ollama = ">=0.5.1,<0.6.0"
sentencepiece = ">=0.2.0,<0.3.0"
sacremoses = ">=0.1.1,<0.2.0"
django-extensions = ">=4.1,<5.0"
notebook = ">=7.4.4,<8.0.0"
jupyterlab = ">=4.4.5,<5.0.0"
requests = ">=2.31.0,<3.0.0"
sqlparse = ">=0.5.3,<0.6.0"
mcp = "^1.20.0"
httpx = ">=0.27.0,<1.0.0"
cryptography = "^46.0.3"
tf-keras = "^2.20.1"

[tool.poetry.scripts]
api = "commands.__main__:main"
media_api = "media_server.manage:main"

[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"
